"mixed-port": 7890
"allow-lan": false
"mode": "rule"
"log-level": "info"
"ipv6": false
"unified-delay": true
"tcp-concurrent": true
"dns":
  "enable": true
  "ipv6": false
  "enhanced-mode": "fake-ip"
  "fake-ip-range": "198.18.0.1/16"
  "fake-ip-filter":
    - "*.lan"
    - "*.local"
  "default-nameserver":
    - "223.5.5.5"
    - "119.29.29.29"
  "nameserver":
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  "fallback":
    - "https://1.1.1.1/dns-query"
    - "https://8.8.8.8/dns-query"
  "fallback-filter":
    "geoip": true
    "geoip-code": "CN"
"proxies":
  -
    "name": "Vultr-Proxy"
    "type": "ss"
    "server": "REPLACE_SERVER_IP"
    "port": 8388
    "cipher": "chacha20-ietf-poly1305"
    "password": "REPLACE_PASSWORD"
    "udp": true
"proxy-groups":
  -
    "name": "PROXY"
    "type": "select"
    "proxies":
      - "Vultr-Proxy"
      - "DIRECT"
  -
    "name": "AI"
    "type": "select"
    "proxies":
      - "Vultr-Proxy"
      - "DIRECT"
  -
    "name": "DEV"
    "type": "select"
    "proxies":
      - "Vultr-Proxy"
      - "DIRECT"
  -
    "name": "Google"
    "type": "select"
    "proxies":
      - "Vultr-Proxy"
      - "DIRECT"
  -
    "name": "YouTube"
    "type": "select"
    "proxies":
      - "Vultr-Proxy"
      - "DIRECT"
  -
    "name": "Microsoft"
    "type": "select"
    "proxies":
      - "Vultr-Proxy"
      - "DIRECT"
  -
    "name": "Apple"
    "type": "select"
    "proxies":
      - "DIRECT"
      - "Vultr-Proxy"
"rules":
  - "DOMAIN-SUFFIX,local,DIRECT"
  - "DOMAIN,localhost,DIRECT"
  - "IP-CIDR,127.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,10.0.0.0/8,DIRECT,no-resolve"
  - "IP-CIDR,172.16.0.0/12,DIRECT,no-resolve"
  - "IP-CIDR,192.168.0.0/16,DIRECT,no-resolve"
  - "IP-CIDR,169.254.0.0/16,DIRECT,no-resolve"
  - "DOMAIN-SUFFIX,openai.com,AI"
  - "DOMAIN-SUFFIX,chatgpt.com,AI"
  - "DOMAIN-SUFFIX,oaistatic.com,AI"
  - "DOMAIN-SUFFIX,oaiusercontent.com,AI"
  - "DOMAIN-SUFFIX,chat.com,AI"
  - "DOMAIN-SUFFIX,claude.ai,AI"
  - "DOMAIN-SUFFIX,claude.com,AI"
  - "DOMAIN-SUFFIX,anthropic.com,AI"
  - "DOMAIN-SUFFIX,cursor.com,DEV"
  - "DOMAIN-SUFFIX,cursor.sh,DEV"
  - "DOMAIN-SUFFIX,cursorapi.com,DEV"
  - "DOMAIN-SUFFIX,github.com,DEV"
